name: Retire obsolete prerelease build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  retire:
    if: github.repository == 'syflu81890-max/Luma'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded build before publishing the cleaned source
        run: gh run cancel 41693388310 --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ github.token }}
